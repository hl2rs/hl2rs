 width="304" height="106" rx="12" fill="#FFFFFF" stroke="#0A62FF" stroke-opacity=".22"/><text x="142" y="168" font-size="12" fill="#0B0C0F">Great question! Here&#x27;s how to keep your</text><text x="142" y="185" font-size="12" fill="#0B0C0F">custom IEMs clean and sounding great:</text><rect x="142" y="196" width="236" height="7" rx="3.5" fill="#E6E8EC"/><rect x="142" y="209" width="196" height="7" rx="3.5" fill="#E6E8EC"/><text x="142" y="240" font-size="9.5" fill="#5B6675" font-weight="700" letter-spacing="1.2">SOURCES</text><rect x="196" y="227" width="76" height="19" rx="9.5" fill="#1ECBE1" fill-opacity=".12" stroke="#1ECBE1" stroke-opacity=".6"/><text x="234" y="240" font-size="10" fill="#0A62FF" font-weight="600" text-anchor="middle">Care guide</text><rect x="278" y="227" width="46" height="19" rx="9.5" fill="#1ECBE1" fill-opacity=".12" stroke="#1ECBE1" stroke-opacity=".6"/><text x="301" y="240" font-size="10" fill="#0A62FF" font-weight="600" text-anchor="middle">FAQ</text></g><rect x="128" y="266" width="338" height="40" rx="12" fill="#FFFFFF" stroke="#E6E8EC"/><text x="144" y="290" font-size="12" fill="#5B6675">Ask anything about UE PRO…</text><circle cx="446" cy="286" r="13" fill="url(#ueSend)"/><path d="M440 286h12M447 281l5 5-5 5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><rect x=".5" y=".5" width="519" height="359" rx="13.5" stroke="#2A2F37"/></g>
