<svg xmlns="http://www.w3.org/2000/svg" width="460" height="380" viewBox="0 0 460 380" fill="none" role="img" aria-label="Career climb at Logitech: Manufacturing → Analyst → Engineer → Solutions Developer on the IT Tiger Team">
