<svg xmlns="http://www.w3.org/2000/svg" width="460" height="400" viewBox="0 0 460 400" fill="none" role="img" aria-label="Career climb at Logitech: Manufacturing → Analyst → Full Stack Developer for UE Pro &amp; IT Software Development">
<title>Career climb at Logitech: Manufacturing → Analyst → Full Stack Developer for UE Pro &amp; IT Software Development</title>
<style>text{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif}.mono{font-family:'Cascadia Code', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}.rm-hide{display:none}}.flag{animation:wave 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}@keyframes wave{0%,100%{transform:skewY(0)}50%{transform:skewY(-10deg)}}.s0{animation:s0 7s ease-out -5.6s infinite}@keyframes s0{0%{opacity:.25}4%,94%{opacity:1}100%{opacity:.25}}.s1{animation:s1 7s ease-out -5.6s infinite}@keyframes s1{0%,30%{opacity:.25}34%,94%{opacity:1}100%{opacity:.25}}.s2{animation:s2 7s ease-out -5.6s infinite}@keyframes s2{0%,60%{opacity:.25}64%,94%{opacity:1}100%{opacity:.25}}</style>
<defs><clipPath id="clip"><rect width="460" height="400" rx="18"/></clipPath><linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop offset="0.000" stop-color="#FFB547" stop-opacity="1"/><stop offset="0.500" stop-color="#FF5F6D" stop-opacity="1"/><stop offset="1.000" stop-color="#FF5FA2" stop-opacity="1"/></linearGradient><linearGradient id="step" x1="0" y1="0" x2="0" y2="1"><stop offset="0.000" stop-color="#FFB547" stop-opacity="1"/><stop offset="1.000" stop-color="#FF5F6D" stop-opacity="1"/></linearGradient><linearGradient id="climber" x1="0" y1="0" x2="1" y2="1"><stop offset="0.000" stop-color="#FFFFFF" stop-opacity="1"/><stop offset="1.000" stop-color="#FFB547" stop-opacity="1"/></linearGradient><radialGradient id="glow"><stop offset="0.000" stop-color="#FFB547" stop-opacity="0.3"/><stop offset="1.000" stop-color="#FFB547" stop-opacity="0"/></radialGradient><filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4"/></filter></defs>
<g clip-path="url(#clip)">
<rect width="460" height="400" fill="#0D1117"/>
<circle cx="400" cy="60" r="200" fill="url(#glow)"/>
<text x="22" y="34" font-size="13" fill="#FFB547" font-weight="600" class="mono">career.climb()</text>
<text x="438" y="34" font-size="12" fill="#8B949E" text-anchor="end" class="mono">Dec 2018 → Present</text>
<line x1="16" y1="372" x2="444" y2="372" stroke="#30363D"/>
<rect x="16" y="314" width="140" height="58" rx="8" fill="url(#step)" fill-opacity="0.20"/>
<rect class="s0" x="16" y="314" width="140" height="4" rx="2" fill="#FFB547"/>
<text x="86" y="338" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">Manufacturing</text>
<text x="86" y="355" font-size="10.5" fill="#E6D5C3" text-anchor="middle">Factory floor</text>
<rect x="160" y="218" width="140" height="154" rx="8" fill="url(#step)" fill-opacity="0.35"/>
<rect class="s1" x="160" y="218" width="140" height="4" rx="2" fill="#FFB547"/>
<text x="230" y="242" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">Analyst</text>
<text x="230" y="259" font-size="10.5" fill="#E6D5C3" text-anchor="middle">Data &amp; automation</text>
<rect x="304" y="122" width="140" height="250" rx="8" fill="url(#step)" fill-opacity="0.50"/>
<rect class="s2" x="304" y="122" width="140" height="4" rx="2" fill="#FFB547"/>
<text x="374" y="146" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">Full Stack</text>
<text x="374" y="162" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">Developer</text>
<text x="374" y="179" font-size="10.5" fill="#E6D5C3" text-anchor="middle">UE Pro &amp; IT</text>
<path d="M430 122V86" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
<path class="flag" d="M430 86h20l-5 7 5 7h-20z" fill="#FF5F6D"/>
<circle r="10" fill="#FFB547" filter="url(#soft)"><animateMotion dur="7s" begin="-5.6s" repeatCount="indefinite" path="M86 304Q158.0 172 230 208Q302.0 76 374 112" calcMode="linear" keyPoints="0;0;0.5;0.5;1;1" keyTimes="0;0.1;0.3;0.4;0.6;1"/></circle>
<circle r="7" fill="url(#climber)"><animateMotion dur="7s" begin="-5.6s" repeatCount="indefinite" path="M86 304Q158.0 172 230 208Q302.0 76 374 112" calcMode="linear" keyPoints="0;0;0.5;0.5;1;1" keyTimes="0;0.1;0.3;0.4;0.6;1"/></circle>
</g>
<rect x=".75" y=".75" width="458.5" height="398.5" rx="17.25" stroke="url(#border)" stroke-opacity=".6" stroke-width="1.5"/>
</svg>
