<style>text{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif}.mono{font-family:'Cascadia Code', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}.rm-hide{display:none}}.flag{animation:wave 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}@keyframes wave{0%,100%{transform:skewY(0)}50%{transform:skewY(-10deg)}}.s0{animation:s0 7s ease-out -5.6s infinite}@keyframes s0{0%{opacity:.25}4%,94%{opacity:1}100%{opacity:.25}}.s1{animation:s1 7s ease-out -5.6s infinite}@keyframes s1{0%,20%{opacity:.25}24%,94%{opacity:1}100%{opacity:.25}}.s2{animation:s2 7s ease-out -5.6s infinite}@keyframes s2{0%,45%{opacity:.25}49%,94%{opacity:1}100%{opacity:.25}}.s3{animation:s3 7s ease-out -5.6s infinite}@keyframes s3{0%,70%{opacity:.25}74%,94%{opacity:1}100%{opacity:.25}}</style>
