<svg xmlns="http://www.w3.org/2000/svg" width="460" height="280" viewBox="0 0 460 280" fill="none" role="img" aria-label="Interests: Traveling, Hiking, Learning">
<title>Interests: Traveling, Hiking, Learning</title>
<style>text{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif}.mono{font-family:'Cascadia Code', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}.rm-hide{display:none}}.fl{animation:fl 4s ease-in-out infinite}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}.orbit{animation:spin 6s linear infinite;transform-origin:80px 112px}@keyframes spin{to{transform:rotate(360deg)}}.sun{animation:rise 4s ease-in-out infinite}@keyframes rise{0%,100%{transform:translateY(10px)}50%{transform:translateY(-4px)}}.trail{stroke-dasharray:3 5;animation:trail 1.5s linear infinite}@keyframes trail{to{stroke-dashoffset:-16}}.twinkle{animation:twinkle 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes twinkle{0%,100%{transform:scale(.4);opacity:.3}50%{transform:scale(1);opacity:1}}</style>
<defs><linearGradient id="t0" x1="0" y1="0" x2="1" y2="1"><stop offset="0.000" stop-color="#2CB1FF" stop-opacity="1"/><stop offset="1.000" stop-color="#7F5AF0" stop-opacity="1"/></linearGradient><linearGradient id="t1" x1="0" y1="0" x2="1" y2="1"><stop offset="0.000" stop-color="#00C9A7" stop-opacity="1"/><stop offset="1.000" stop-color="#1B7F5C" stop-opacity="1"/></linearGradient><linearGradient id="t2" x1="0" y1="0" x2="1" y2="1"><stop offset="0.000" stop-color="#FFB547" stop-opacity="1"/><stop offset="1.000" stop-color="#FF5F6D" stop-opacity="1"/></linearGradient></defs>
<g class="fl" style="animation-delay:-0.0s">
<rect x="10" y="14" width="140" height="252" rx="20" fill="url(#t0)"/>
<rect x="10" y="14" width="140" height="252" rx="20" stroke="#FFFFFF" stroke-opacity=".25"/>
<circle cx="80" cy="112" r="38" fill="#FFFFFF" fill-opacity=".14" stroke="#FFFFFF" stroke-width="3"/><ellipse cx="80" cy="112" rx="15" ry="38" stroke="#FFFFFF" stroke-width="2.2"/><path d="M42 112h76M48 94h64M48 130h64" stroke="#FFFFFF" stroke-width="2.2"/><g class="orbit"><path d="M90 56L74 52L72 46L69 46L70 53L64 54L64 58L70 59L69 66L72 66L74 60z" fill="#FFFFFF"/></g>
<text x="80" y="210" font-size="18" fill="#FFFFFF" font-weight="700" text-anchor="middle">Traveling</text>
<text x="80" y="232" font-size="11.5" fill="#FFFFFF" font-weight="500" text-anchor="middle" fill-opacity="0.88">new places &amp; ideas</text>
</g>
<g class="fl" style="animation-delay:-1.2s">
<rect x="160" y="14" width="140" height="252" rx="20" fill="url(#t1)"/>
<rect x="160" y="14" width="140" height="252" rx="20" stroke="#FFFFFF" stroke-opacity=".25"/>
<circle class="sun" cx="252" cy="88" r="14" fill="#FFE08A"/><path d="M182 150L220 92L258 150z" fill="#FFFFFF" fill-opacity=".55"/><path d="M204 150L246 100L284 150z" fill="#FFFFFF"/><path class="trail" d="M206 150C222 140 236 136 236 126S248 118 246 106" stroke="#1B7F5C" stroke-width="2.5" stroke-linecap="round"/><path d="M176 150h112" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
<text x="230" y="210" font-size="18" fill="#FFFFFF" font-weight="700" text-anchor="middle">Hiking</text>
<text x="230" y="232" font-size="11.5" fill="#FFFFFF" font-weight="500" text-anchor="middle" fill-opacity="0.88">trails &amp; summits</text>
</g>
<g class="fl" style="animation-delay:-2.4s">
<rect x="310" y="14" width="140" height="252" rx="20" fill="url(#t2)"/>
<rect x="310" y="14" width="140" height="252" rx="20" stroke="#FFFFFF" stroke-opacity=".25"/>
<path d="M340 100Q358 92 378 100V142Q358 134 340 142z" fill="#FFFFFF"/><path d="M382 100Q402 92 420 100V142Q402 134 382 142z" fill="#FFFFFF" fill-opacity=".85"/><path d="M348 110h22M348 119h22M348 128h16M390 110h22M390 119h22M390 128h14" stroke="#FF8A5B" stroke-width="2" stroke-linecap="round"/><g transform="translate(352 76)"><path class="twinkle" d="M0 -7L1.8 -1.8L7 0L1.8 1.8L0 7L-1.8 1.8L-7 0L-1.8 -1.8z" fill="#FFFFFF" style="animation-delay:-0s"/></g><g transform="translate(410 70)"><path class="twinkle" d="M0 -7L1.8 -1.8L7 0L1.8 1.8L0 7L-1.8 1.8L-7 0L-1.8 -1.8z" fill="#FFFFFF" style="animation-delay:-0.7s"/></g><g transform="translate(384 60)"><path class="twinkle" d="M0 -7L1.8 -1.8L7 0L1.8 1.8L0 7L-1.8 1.8L-7 0L-1.8 -1.8z" fill="#FFFFFF" style="animation-delay:-1.3s"/></g>
<text x="380" y="210" font-size="18" fill="#FFFFFF" font-weight="700" text-anchor="middle">Learning</text>
<text x="380" y="232" font-size="11.5" fill="#FFFFFF" font-weight="500" text-anchor="middle" fill-opacity="0.88">always leveling up</text>
</g>
</svg>
